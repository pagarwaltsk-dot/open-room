<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2340">
<title>Open Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    --ink:#1B2340; --muted:#5B647D; --bg:#F3F5FA; --card:#FFFFFF; --line:#DDE2EC;
    --teal:#0F6E70; --teal-soft:#E3F4EF; --gold:#F2A900; --gold-soft:#FFF4D6; --red:#C4382C; --red-soft:#FCEBEA;
    --live:#10162B;
    --fd:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --fb:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--teal)}
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 16px;display:flex;align-items:center;gap:12px}
  header.top.teacher{background:var(--teal)}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:20px;flex:0 0 auto}
  .ttl{flex:1;min-width:0}
  .ttl .a{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1}
  .ttl .b{font-size:13px;opacity:.8}
  .hbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;min-height:40px}
  main{flex:1;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
  .card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .badge{min-width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;padding:0 6px;text-align:center}
  .ctitle{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.15}
  .sm{font-size:13.5px;color:var(--muted)}
  .btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:800;font-size:15.5px;background:var(--gold);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.teal{background:var(--teal);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.red{background:var(--red);color:#fff}
  .btn.small{min-height:42px;font-size:14px;padding:0 14px;border-radius:12px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:default}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .tag.wait{background:var(--gold-soft);color:#8A5A00}
  .tag.ok{background:var(--teal-soft);color:var(--teal)}
  .tag.no{background:var(--red-soft);color:var(--red)}
  label.f{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
  .in{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
  textarea.in{resize:vertical;min-height:72px}
  .empty{text-align:center;color:var(--muted);padding:26px 14px;background:#fff;border-radius:18px}
  .foot{text-align:center;padding:10px 0 24px}
  .foot button{background:none;border:0;color:var(--muted);font-size:13.5px;text-decoration:underline;min-height:40px}
  .tabs{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px}
  .tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:800;color:var(--muted);font-size:14px}
  .tabs button.on{background:var(--teal);color:#fff}
  .count{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px;margin-left:4px}
  .veil{position:fixed;inset:0;background:rgba(16,22,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .sheet h2{margin:0;font-family:var(--fd);font-size:22px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14.5px;z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  #toast.bad{background:var(--red)}
  .upi{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1.5px dashed var(--line)}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:15px;word-break:break-all}
  /* live room */
  #live{position:fixed;inset:0;background:var(--live);z-index:30;display:flex;flex-direction:column}
  #live .bar{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;color:#fff}
  #live .dot{background:#E5484D;border-radius:999px;font-size:12px;font-weight:800;padding:4px 10px}
  #live .frame{flex:1;min-height:0;position:relative}
  #live .ctl{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:#0A0F1F}
  #live .ctl button{flex:1;min-width:0;min-height:54px;border:0;border-radius:14px;font-weight:800;font-size:13px;background:#222A44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;white-space:nowrap}
  #live .ctl button b{font-size:18px;font-weight:400}
  #live .ctl button.gold{background:var(--gold);color:var(--ink)}
  #liveTop{position:absolute;left:8px;right:8px;top:8px;z-index:7;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  #liveTop > *{pointer-events:auto}
  #liveStrip{display:flex;flex-wrap:wrap;gap:6px}
  #liveStrip:empty{display:none}
  .schip{border:0;border-radius:999px;background:rgba(16,22,43,.85);color:#fff;font-weight:800;font-size:13.5px;min-height:38px;padding:0 13px;display:inline-flex;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
  .schip.gold{background:var(--gold);color:var(--ink)}
  #live .ctl button{padding:0 4px}
  .pop{position:absolute;left:12px;right:12px;z-index:8;background:#fff;color:var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 34px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
  #quizCard{top:50%;transform:translateY(-50%);z-index:6}
  #voiceCard{bottom:12px}
  #speakPop{top:50%;transform:translateY(-50%);text-align:center;align-items:center}
  .qhead{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
  .qx{border:0;background:#EEF1F7;border-radius:999px;width:36px;height:36px;font-weight:800}
  .qq{font-family:var(--fd);font-weight:800;font-size:30px;line-height:1.1;text-align:center}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qopt{border:0;border-radius:14px;min-height:64px;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;word-break:break-word}
  .qopt.dim{opacity:.35}
  .qopt.picked{outline:4px solid var(--ink);outline-offset:2px}
  .qopt.right{outline:4px solid var(--teal);outline-offset:2px;opacity:1}
  .qres{background:var(--gold-soft);border-radius:12px;padding:10px;font-weight:800;text-align:center;font-size:17px}
  .recdot{width:16px;height:16px;border-radius:50%;background:var(--red)}
  @media (prefers-reduced-motion:no-preference){ .recdot{animation:blink 1s infinite} @keyframes blink{50%{opacity:.25}} }
  #board{position:absolute;inset:0;z-index:4;background:#0A0F1F;display:flex;flex-direction:column}
  .btools{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px;flex:0 0 auto;padding-top:54px}
  .bstage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
  #bCanvas{background:#fff;border-radius:12px;touch-action:none;display:block}
  .btitle{position:absolute;left:0;right:0;bottom:2px;text-align:center;color:#C9CEDD;font-size:12.5px;font-weight:700;pointer-events:none}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid #2A3352;flex:0 0 auto}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
  .tb{border:0;border-radius:10px;min-height:38px;padding:0 10px;background:#222A44;color:#fff;font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .tb.on{background:#fff;color:var(--ink)}
  .tb.gold{background:var(--gold);color:var(--ink)}
  .thumb{border-radius:10px;border:1.5px solid var(--line);max-width:100%}
  #liveWait{position:absolute;inset:0;z-index:9;background:var(--live);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
  .door{font-size:64px}
  @media (prefers-reduced-motion:no-preference){ .door{animation:bob 2s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}} }
  #game{position:absolute;inset:0;z-index:5;background:#0A0F1F;display:flex;flex-direction:column}
  .gpanel{background:#fff;border-radius:18px 18px 0 0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .gpl{display:flex;flex-wrap:wrap;gap:6px}
  .gtag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;background:#EEF1F7;border-radius:999px;padding:4px 10px}
  .gtag.on{background:var(--gold)}
  .gtag i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .gmsg{font-weight:700;font-size:15px}
  .gwait{font-weight:800;color:var(--muted)}
  .gpanel .tb{background:#EEF1F7;color:var(--ink)}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mbtn{border:0;background:#fff;border-radius:16px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;padding:8px}
  .mbtn span{font-size:13.5px;font-weight:800;text-align:center}
  #taskBanner{background:var(--gold);color:var(--ink);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #taskBanner .t{flex:1;font-weight:800;font-size:16px}
  #taskBanner .s{font-family:var(--fd);font-weight:800;font-size:28px}
  #starPop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:20px;padding:16px 22px;font-family:var(--fd);font-weight:800;font-size:24px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
  #starPop .big{font-size:44px;color:var(--gold);line-height:1}
  .hide{display:none!important}
  @media (prefers-reduced-motion:no-preference){ #starPop{animation:pop .35s ease-out} @keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}} }
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="overlay"></div>
<div id="toast" class="hide"></div>
<div id="live" class="hide">
  <div class="bar"><span class="dot">● LIVE</span><span class="grow" id="liveTitle" style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span></div>
  <div class="frame" id="liveFrame">
    <div id="board" class="hide"><div class="btools" id="bTools"></div><div class="bstage" id="bStage"><canvas id="bCanvas"></canvas><div class="btitle" id="bTitle"></div></div></div>
    <div id="game" class="hide"><div class="bstage" id="gStage" style="padding-top:50px"><canvas id="gCanvas" style="border-radius:10px;display:block"></canvas></div><div id="gPanel" class="gpanel"></div></div>
    <div id="liveTop"><div id="liveStrip"></div>
      <div id="taskBanner" class="hide"><div class="grow"><div style="font-size:11.5px;font-weight:800;letter-spacing:.08em">TASK FOR EVERYONE</div><div class="t" id="taskText"></div></div><div class="s" id="taskSecs"></div></div>
    </div>
    <div id="starPop" class="hide"><div class="big">★</div><div id="starName"></div></div>
    <div id="quizCard" class="pop hide" role="dialog" aria-label="Quiz"></div>
    <div id="voiceCard" class="pop hide" role="dialog" aria-label="Voice answer"></div>
    <div id="speakPop" class="pop hide" role="dialog" aria-label="Your turn to talk"></div>
    <div id="liveWait" class="hide"></div>
  </div>
  <div class="ctl" id="liveCtl"></div>
</div>

<script>
/* ================= YOUR SUPABASE PROJECT =================
   Supabase > Project Settings > API Keys (or the Connect button):
     SUPA_URL = the Project URL, like https://abcdefgh.supabase.co
     SUPA_KEY = the Publishable key (sb_publishable_...) or the anon key.
   Both are meant to be public: the tables are locked and the only way in
   is or_call(), which checks every sign-in. */
const SUPA_URL = 'https://miwmufhgtcxencpkfkee.supabase.co';
const SUPA_KEY = 'sb_publishable_sD26ic7vp4rOIkI3bJVEUw_G90-irWk';

/* ---------------- small helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSK = 'openroom:v1';
let ME = { tok: '', role: '' };
try { ME = Object.assign(ME, JSON.parse(localStorage.getItem(LSK) || '{}')); } catch (e) {}
const keep = () => { try { localStorage.setItem(LSK, JSON.stringify(ME)); } catch (e) {} };
const KINDS = ['Dance', 'Drawing', 'Craft', 'Story time', 'Music', 'Science fun', 'Yoga', 'Cooking', 'Other'];
const TINT = { 'Dance':'#FCE7B2', 'Drawing':'#F7DCE6', 'Craft':'#DDF0DC', 'Story time':'#E4E0F7', 'Music':'#D9EEF0', 'Science fun':'#D9E6FA', 'Yoga':'#E8F1D6', 'Cooking':'#FDE2D0', 'Other':'#E6E9F2' };
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const when = iso => new Date(iso).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const startMs = c => Date.parse(c.starts_at);
const roomOpen = c => Date.now() >= startMs(c) - 15 * 60000 && Date.now() <= startMs(c) + (c.minutes + 30) * 60000;
let toastT = null;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; clearTimeout(toastT);
  toastT = setTimeout(() => t.className = 'hide', 3200);
}
function sheet(html, wire) {
  $('overlay').innerHTML = '<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('veil').onclick = e => { if (e.target.id === 'veil') closeSheet(); };
  if (wire) wire();
}
function closeSheet() { $('overlay').innerHTML = ''; }

/* ---------------- talking to the server ---------------- */
const keyHeaders = () => Object.assign({ 'Content-Type': 'application/json', apikey: SUPA_KEY },
  /^eyJ/.test(SUPA_KEY) ? { Authorization: 'Bearer ' + SUPA_KEY } : {});
async function api(p) {
  const body = Object.assign({}, p);
  if (ME.tok) body.tok = ME.tok;
  let r;
  try {
    r = await fetch(SUPA_URL.replace(/\/+$/, '') + '/rest/v1/rpc/or_call', { method: 'POST', headers: keyHeaders(), body: JSON.stringify({ p: body }) });
  } catch (e) { throw new Error('No internet connection'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Server replied ' + r.status));
  if (j && j.need_login) { ME = { tok: '', role: '' }; keep(); go(S.screen && S.screen.charAt(0) === 't' ? 'tlogin' : 'home'); throw new Error('Please sign in again'); }
  if (j && j.error) throw new Error(j.error);
  return j;
}
async function roomPass(classId) {
  const r = await fetch(SUPA_URL.replace(/\/+$/, '') + '/functions/v1/room', { method: 'POST', headers: keyHeaders(), body: JSON.stringify({ tok: ME.tok, class_id: classId }) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || !j.url) {
    let m = j && (j.error || j.message || j.msg);
    if (m && typeof m !== 'string') { try { m = JSON.stringify(m); } catch (e) { m = String(m); } }
    throw new Error((m || 'Could not open the class room') + ' (' + r.status + ')');
  }
  return j;
}

/* ---------------- state and screens ---------------- */
let S = { screen: 'home' }, INFO = { teacher: '', intro: '', upi: '', upi_name: '', ready: true }, CLASSES = [], MINE = null, OV = null;
function go(screen, extra) { S = Object.assign({ screen: screen }, extra || {}); render(); window.scrollTo(0, 0); }
function render() {
  const v = { home: vHome, book: vBook, tlogin: vTLogin, tclasses: vTClasses, tclass: vTClass, tpay: vTPay, tset: vTSet }[S.screen] || vHome;
  v();
  if ($('app') && !$('verTag')) $('app').insertAdjacentHTML('beforeend', '<div id="verTag" class="sm" style="text-align:center;opacity:.5;padding:18px 0 28px">Open Room · version 5-Oct-D</div>');
}
async function loadPublic() {
  try { INFO = await api({ action: 'info' }); } catch (e) {}
  try { CLASSES = (await api({ action: 'classes' })).classes || []; } catch (e) { toast(e.message, true); }
}
async function loadMine() {
  if (ME.role !== 'parent' || !ME.tok) { MINE = null; return; }
  try { MINE = await api({ action: 'me' }); } catch (e) { MINE = null; }
}
async function loadTeacher() {
  try { OV = (await api({ action: 'overview' })).classes || []; } catch (e) { toast(e.message, true); OV = OV || []; }
}

/* ----- parent: home ----- */
function starCards() {
  const all = certs(), ids = Object.keys(all).sort((a, b) => new Date(all[b].at) - new Date(all[a].at)).slice(0, 6);
  if (!ids.length) return '';
  return '<div class="lbl">Star cards</div><div class="card" style="gap:6px">' + ids.map(id => {
    const c = all[id];
    return '<div class="row"><div class="grow"><div style="font-weight:800">⭐ ' + (c.stars || 0) + ' · ' + esc(c.name) + '</div><div class="sm">' + esc(c.title) + ' · ' + esc(when(c.at)) + '</div></div>' +
      '<button class="btn ghost small" data-cert="' + esc(id) + '">View</button></div>';
  }).join('') + '</div>';
}
function header(teacher) {
  return '<header class="top' + (teacher ? ' teacher' : '') + '"><div class="logo">OR</div><div class="ttl">' +
    '<div class="a">' + (teacher ? 'Teacher' : 'Open Room') + '</div>' +
    '<div class="b">' + esc(teacher ? (INFO.teacher || '') : ('Small live classes' + (INFO.teacher ? ' with ' + INFO.teacher : ''))) + '</div></div>' +
    (teacher ? '<button class="hbtn" id="hSet">Settings</button>'
             : (ME.role === 'parent' ? '<button class="hbtn" id="hOut">Sign out</button>' : '<button class="hbtn" id="hIn">Sign in</button>')) +
    '</header>';
}
function classCard(c, mineForClass) {
  const full = c.left <= 0;
  return '<div class="card"><div class="row" style="align-items:flex-start;gap:12px">' +
    '<div class="badge" style="background:' + (TINT[c.kind] || TINT.Other) + '">' + esc(c.kind || 'Class') + '</div>' +
    '<div class="grow"><div class="ctitle">' + esc(c.title) + '</div>' +
    '<div class="sm">' + esc(when(c.starts_at)) + ' · ' + c.minutes + ' min · ' + (c.fee ? money(c.fee) : 'Free') + '</div>' +
    (c.about ? '<div class="sm" style="margin-top:4px;color:var(--ink)">' + esc(c.about) + '</div>' : '') + '</div></div>' +
    '<div class="row"><div class="grow sm" style="font-weight:700">' +
      (mineForClass ? esc(mineForClass) : (full ? 'Full' : (c.left === 1 ? 'Last seat left' : c.left + ' of ' + c.seats + ' seats left'))) + '</div>' +
    '<button class="btn small" data-book="' + c.id + '"' + (full ? ' disabled' : '') + '>' + (full ? 'Full' : 'Book a seat') + '</button></div></div>';
}
function statusTag(b) {
  if (b.status === 'confirmed') return '<span class="tag ok">Seat confirmed</span>';
  if (b.status === 'pending') return '<span class="tag wait">Checking payment</span>';
  if (b.status === 'rejected') return '<span class="tag no">Payment not found</span>';
  return '<span class="tag no">Cancelled</span>';
}
function vHome() {
  const mine = (MINE && MINE.bookings) || [];
  const upcoming = mine.filter(b => startMs(b.class) + (b.class.minutes + 30) * 60000 > Date.now() && b.status !== 'cancelled');
  const byClass = {};
  upcoming.forEach(b => { (byClass[b.class.id] = byClass[b.class.id] || []).push(b.child); });
  $('app').innerHTML = header(false) + '<main>' +
    (INFO.intro ? '<div class="card" style="background:var(--ink);color:#fff"><div style="font-weight:800">' + esc(INFO.teacher) + '</div><div style="font-size:14.5px;opacity:.9">' + esc(INFO.intro) + '</div></div>' : '') +
    (upcoming.length ? '<div class="lbl">My bookings</div>' + upcoming.map(b => {
        const open = b.status === 'confirmed' && roomOpen(b.class);
        return '<div class="card"><div class="row"><div class="grow"><div style="font-weight:800">' + esc(b.class.title) + '</div>' +
          '<div class="sm">' + esc(b.child) + ' · ' + esc(when(b.class.starts_at)) + '</div></div>' + statusTag(b) + '</div>' +
          (b.status === 'confirmed' ? '<button class="btn teal block" data-join="' + b.class.id + '"' + (open ? '' : ' disabled') + '>' +
             (open ? 'Join the class now' : 'Join opens 15 min before') + '</button>' : '') +
          (b.status === 'rejected' ? '<div class="sm">The teacher could not find this payment. Book again with the right UPI reference, or message her.</div>' : '') +
          (b.status === 'pending' ? '<div class="sm">The teacher checks the payment and confirms your seat. Usually within a few hours.</div>' : '') +
          '</div>';
      }).join('') : '') +
    starCards() +
    '<div class="lbl">Classes this week</div>' +
    (CLASSES.length ? CLASSES.map(c => classCard(c, byClass[c.id] ? 'Booked for ' + byClass[c.id].join(', ') : '')).join('')
                    : '<div class="empty">No classes open right now. Check back soon.</div>') +
    '<div class="sm" style="text-align:center;padding:4px 10px">Every class is live, with the teacher and at most a few children, so each child is seen and heard.</div>' +
    '</main><div class="foot"><button id="iAmT">I’m the teacher</button></div>';
  document.querySelectorAll('[data-cert]').forEach(b => b.onclick = () => showCert(b.dataset.cert, false));
  if ($('hIn')) $('hIn').onclick = () => authSheet(null);
  if ($('hOut')) $('hOut').onclick = () => { ME = { tok: '', role: '' }; keep(); MINE = null; vHome(); toast('Signed out'); };
  $('iAmT').onclick = () => go('tlogin');
  document.querySelectorAll('[data-book]').forEach(b => b.onclick = () => {
    const c = CLASSES.find(x => x.id === b.dataset.book);
    if (ME.role !== 'parent') return authSheet(async () => {
      /* free class + only one child: book straight away, so signing up is not mistaken for booking */
      const kids = (MINE && MINE.children) || [];
      const already = ((MINE && MINE.bookings) || []).some(x => x.class && x.class.id === c.id && x.status !== 'cancelled');
      if (!c.fee && kids.length === 1 && !already) {
        try {
          await api({ action: 'book', class_id: c.id, child_id: kids[0].id, utr: '' });
          await Promise.all([loadMine(), loadPublic()]);
          go('home'); return toast('Seat booked for ' + kids[0].name + '!');
        } catch (e) { toast(e.message, true); }
      }
      go('book', { cls: c });
    });
    go('book', { cls: c });
  });
  document.querySelectorAll('[data-join]').forEach(b => b.onclick = () => {
    const bk = mine.find(x => x.class.id === b.dataset.join); joinLive(bk.class, false);
  });
}

/* ----- parent: sign up / sign in ----- */
function authSheet(after, mode) {
  mode = mode || 'new';
  sheet('<h2>' + (mode === 'new' ? 'Your details' : 'Sign in') + '</h2>' +
    '<div class="tabs"><button id="aNew" class="' + (mode === 'new' ? 'on' : '') + '">New here</button><button id="aOld" class="' + (mode === 'old' ? 'on' : '') + '">I have an account</button></div>' +
    (mode === 'new'
      ? '<div><label class="f" for="pName">Your name (parent)</label><input class="in" id="pName" autocomplete="name"></div>' +
        '<div><label class="f" for="pPhone">Mobile number (WhatsApp)</label><input class="in" id="pPhone" inputmode="tel" autocomplete="tel"></div>' +
        '<div class="row" style="gap:10px"><div class="grow"><label class="f" for="cName">Child’s name</label><input class="in" id="cName"></div>' +
        '<div style="width:96px"><label class="f" for="cAge">Age</label><input class="in" id="cAge" inputmode="numeric"></div></div>' +
        '<div><label class="f" for="pPin">Choose a 4-digit PIN</label><input class="in" id="pPin" inputmode="numeric" maxlength="4" type="password" autocomplete="new-password"></div>' +
        '<div class="sm">You will use your number and this PIN to sign in on another phone.</div>'
      : '<div><label class="f" for="pPhone">Mobile number</label><input class="in" id="pPhone" inputmode="tel" autocomplete="tel"></div>' +
        '<div><label class="f" for="pPin">PIN</label><input class="in" id="pPin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"></div>') +
    '<button class="btn block" id="aGo">' + (mode === 'new' ? 'Continue' : 'Sign in') + '</button>',
    () => {
      $('aNew').onclick = () => authSheet(after, 'new');
      $('aOld').onclick = () => authSheet(after, 'old');
      $('aGo').onclick = async () => {
        $('aGo').disabled = true;
        try {
          const j = mode === 'new'
            ? await api({ action: 'parent_signup', name: $('pName').value, phone: $('pPhone').value, child: $('cName').value, age: $('cAge').value, pin: $('pPin').value })
            : await api({ action: 'parent_login', phone: $('pPhone').value, pin: $('pPin').value });
          ME = { tok: j.tok, role: 'parent' }; keep(); closeSheet();
          await loadMine(); toast('Welcome!');
          if (after) after(); else vHome();
        } catch (e) { $('aGo').disabled = false; toast(e.message, true); }
      };
    });
}

/* ----- parent: book a seat ----- */
function upiLink(c) {
  return 'upi://pay?pa=' + encodeURIComponent(INFO.upi) + '&pn=' + encodeURIComponent(INFO.upi_name || INFO.teacher || 'Teacher') +
    '&am=' + encodeURIComponent(c.fee) + '&cu=INR&tn=' + encodeURIComponent(('Open Room ' + c.title).slice(0, 40));
}
function vBook() {
  const c = S.cls; if (!c) return go('home');
  const kids = (MINE && MINE.children) || [];
  if (!S.child && kids.length) S.child = kids[0].id;
  $('app').innerHTML = header(false) + '<main>' +
    '<button class="chip" id="bBack" style="align-self:flex-start">‹ Back</button>' +
    classCard(Object.assign({}, c), '') +
    '<div class="lbl">Who is coming?</div><div class="card"><div class="chips">' +
      kids.map(k => '<button class="chip' + (S.child === k.id ? ' on' : '') + '" data-kid="' + k.id + '">' + esc(k.name) + (k.age ? ', ' + k.age : '') + '</button>').join('') +
      '<button class="chip" id="bAddKid">+ Another child</button></div></div>' +
    (c.fee ? '<div class="lbl">Pay ' + money(c.fee) + ' by UPI</div><div class="upi">' +
        '<a class="btn teal block" href="' + esc(upiLink(c)) + '">Pay ' + money(c.fee) + ' with a UPI app</a>' +
        '<div class="sm">Or pay to this UPI ID from any app:</div>' +
        '<div class="row"><div class="grow mono" id="upiId">' + esc(INFO.upi || '[UPI ID not set yet]') + '</div><button class="chip" id="bCopy">Copy</button></div>' +
        '<div class="sm">Name: ' + esc(INFO.upi_name || INFO.teacher) + '</div></div>' +
        '<div><label class="f" for="bUtr">UPI reference number (12 digits, shown in your payment app after paying)</label>' +
        '<input class="in" id="bUtr" inputmode="numeric" placeholder="e.g. 412345678901"></div>' : '') +
    '<div class="sm" style="text-align:center;font-weight:700;color:var(--ink)">Not booked yet — tap the button below to book the seat.</div>' +
    '<button class="btn block" id="bGo">' + (c.fee ? 'I have paid — book my seat' : 'Book my seat') + '</button>' +
    (c.fee ? '<div class="sm" style="text-align:center">The teacher checks the payment and confirms your seat.</div>' : '') +
    '</main>';
  $('bBack').onclick = () => go('home');
  document.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { S.child = b.dataset.kid; vBook(); });
  $('bAddKid').onclick = () => sheet('<h2>Add a child</h2>' +
    '<div><label class="f" for="nkName">Name</label><input class="in" id="nkName"></div>' +
    '<div><label class="f" for="nkAge">Age</label><input class="in" id="nkAge" inputmode="numeric"></div>' +
    '<button class="btn block" id="nkGo">Add</button>', () => {
      $('nkGo').onclick = async () => {
        try { await api({ action: 'add_child', name: $('nkName').value, age: $('nkAge').value }); await loadMine();
          const ks = MINE.children; S.child = ks[ks.length - 1].id; closeSheet(); vBook(); }
        catch (e) { toast(e.message, true); }
      };
    });
  if ($('bCopy')) $('bCopy').onclick = () => {
    const t = INFO.upi;
    try { navigator.clipboard.writeText(t).then(() => toast('UPI ID copied'), () => toast(t)); } catch (e) { toast(t); }
  };
  $('bGo').onclick = async () => {
    if (!S.child) return toast('Pick your child', true);
    $('bGo').disabled = true;
    try {
      await api({ action: 'book', class_id: c.id, child_id: S.child, utr: $('bUtr') ? $('bUtr').value : '' });
      await Promise.all([loadMine(), loadPublic()]);
      go('home'); toast(c.fee ? 'Booked! The teacher will confirm your seat.' : 'Seat booked!');
    } catch (e) { $('bGo').disabled = false; toast(e.message, true); }
  };
}

/* ----- teacher: classes ----- */
function tTabs(on) {
  const pend = (OV || []).reduce((n, c) => n + (c.bookings || []).filter(b => b.status === 'pending').length, 0);
  return '<div class="tabs"><button data-tt="tclasses" class="' + (on === 'tclasses' ? 'on' : '') + '">Classes</button>' +
    '<button data-tt="tpay" class="' + (on === 'tpay' ? 'on' : '') + '">Payments' + (pend ? '<span class="count">' + pend + '</span>' : '') + '</button><button id="tRef" aria-label="Refresh">↻ Refresh</button></div>';
}
function wireTeacher() {
  document.querySelectorAll('[data-tt]').forEach(b => b.onclick = async () => { const to = b.dataset.tt; await loadTeacher(); go(to); });
  if ($('tRef')) $('tRef').onclick = async () => { $('tRef').disabled = true; await loadTeacher(); render(); toast('Up to date'); };
  if ($('hSet')) $('hSet').onclick = () => go('tset');
}
function vTClasses() {
  if (ME.role !== 'teacher') return go('tlogin');
  const list = (OV || []).filter(c => c.status === 'open' && startMs(c) + (c.minutes + 30) * 60000 > Date.now());
  const done = (OV || []).filter(c => c.status === 'open' && startMs(c) + (c.minutes + 30) * 60000 <= Date.now()).reverse();
  $('app').innerHTML = header(true) + '<main>' + tTabs('tclasses') +
    '<button class="btn block" id="tNew">+ Open a new class</button>' +
    (list.length ? list.map(c => {
      const conf = c.bookings.filter(b => b.status === 'confirmed'), pend = c.bookings.filter(b => b.status === 'pending');
      const open = roomOpen(c);
      return '<div class="card"><div class="row" style="align-items:flex-start;gap:12px"><div class="badge" style="background:' + (TINT[c.kind] || TINT.Other) + '">' + esc(c.kind || 'Class') + '</div>' +
        '<div class="grow"><div class="ctitle">' + esc(c.title) + '</div><div class="sm">' + esc(when(c.starts_at)) + ' · ' + c.minutes + ' min · ' + (c.fee ? money(c.fee) : 'Free') + '</div></div></div>' +
        '<div class="sm" style="color:var(--ink)"><b>' + conf.length + '</b> confirmed' + (pend.length ? ', <b>' + pend.length + '</b> waiting for payment check' : '') + ' · ' + c.seats + ' seats</div>' +
        (conf.length ? '<div class="sm">' + conf.map(b => esc(b.child) + (b.age ? ' (' + b.age + ')' : '')).join(', ') + '</div>' : '') +
        '<div class="row" style="flex-wrap:wrap">' +
          '<button class="btn teal small" data-start="' + c.id + '"' + (open ? '' : ' disabled') + '>' + (open ? 'Start class' : 'Start (15 min before)') + '</button>' +
          '<button class="btn ghost small" data-edit="' + c.id + '">Edit</button>' +
          '<button class="btn ghost small" data-cancel="' + c.id + '" style="color:var(--red)">Cancel</button></div></div>';
    }).join('') : '<div class="empty">No classes open. Tap “Open a new class” to start.</div>') +
    (done.length ? '<div class="lbl">Finished (last 3 days)</div>' + done.map(c =>
      '<div class="card"><div class="row"><div class="grow"><div style="font-weight:800">' + esc(c.title) + '</div>' +
      '<div class="sm">' + esc(when(c.starts_at)) + ' · ' + c.bookings.filter(b => b.status === 'confirmed').length + ' children</div></div>' +
      (c.voices ? '<button class="btn teal small" data-voices="' + c.id + '">🎧 ' + c.voices + '</button>' : '') + '</div></div>').join('') : '') +
    '</main>';
  wireTeacher();
  $('tNew').onclick = () => go('tclass', { edit: null });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => go('tclass', { edit: OV.find(c => c.id === b.dataset.edit) }));
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => joinLive(OV.find(c => c.id === b.dataset.start), true));
  document.querySelectorAll('[data-voices]').forEach(b => b.onclick = () => voiceSheet(b.dataset.voices, false));
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    const c = OV.find(x => x.id === b.dataset.cancel);
    sheet('<h2>Cancel this class?</h2><div>' + esc(c.title) + '</div><div class="sm">It disappears for parents. Message the booked families and refund or move them to another class.</div>' +
      '<button class="btn red block" id="cxGo">Cancel the class</button><button class="btn ghost block" id="cxNo">Keep it</button>', () => {
        $('cxNo').onclick = closeSheet;
        $('cxGo').onclick = async () => { try { await api({ action: 'class_cancel', id: c.id }); closeSheet(); await loadTeacher(); vTClasses(); toast('Class cancelled'); } catch (e) { toast(e.message, true); } };
      });
  });
}
function localInput(iso) {
  const d = iso ? new Date(iso) : new Date(Date.now() + 86400000);
  if (!iso) { d.setHours(17, 0, 0, 0); }
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

  const c = S.edit || { title: '', kind: 'Dance', about: '', minutes: 40, seats: 5, fee: 200 };
  if (!S.kind) S.kind = c.kind || 'Dance';
  $('app').innerHTML = header(true) + '<main>' +

      '<div class="grow"><label class="f" for="fFee">Fee (₹)</label><input class="in" id="fFee" inputmode="numeric" value="' + c.fee + '"></div></div>' +
    '<button class="btn block" id="fGo">' + (S.edit ? 'Save changes' : 'Open for booking') + '</button>' +

  $('fBack').onclick = () => go('tclasses');
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {

  });
  $('fGo').onclick = async () => {

    try {

/* ----- teacher: payments to check ----- */
function vTPay() {
  if (ME.role !== 'teacher') return go('tlogin');
  const rows = [];
  (OV || []).forEach(c => (c.bookings || []).forEach(b => { if (b.status === 'pending') rows.push({ c: c, b: b }); }));
  $('app').innerHTML = header(true) + '<main>' + tTabs('tpay') +
    '<div class="sm">Open your UPI app, find each payment by its reference number, then confirm it here. The child can join only after you confirm.</div>' +
    (rows.length ? rows.map(r => '<div class="card">' +
      '<div class="row"><div class="grow"><div style="font-weight:800">' + esc(r.b.child) + (r.b.age ? ', ' + r.b.age : '') + '</div>' +
      '<div class="sm">' + esc(r.c.title) + ' · ' + esc(when(r.c.starts_at)) + '</div></div><div style="font-weight:800">' + money(r.b.amount) + '</div></div>' +
      '<div class="sm">Parent: ' + esc(r.b.parent) + ' · <a href="tel:' + esc(r.b.phone) + '">' + esc(r.b.phone) + '</a></div>' +
      '<div class="row"><div class="sm">UPI ref:</div><div class="mono grow">' + esc(r.b.utr || '—') + '</div></div>' +
      '<div class="row"><button class="btn teal small grow" data-ok="' + r.b.id + '">Payment received</button><button class="btn ghost small" data-no="' + r.b.id + '" style="color:var(--red)">Not found</button></div></div>').join('')
      : '<div class="empty">No payments waiting. All caught up.</div>') +
    '</main>';
  wireTeacher();
  const decide = async (id, status) => { try { await api({ action: 'decide', id: id, status: status }); await loadTeacher(); vTPay(); toast(status === 'confirmed' ? 'Seat confirmed' : 'Marked as not found'); } catch (e) { toast(e.message, true); } };
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => decide(b.dataset.ok, 'confirmed'));
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = () => decide(b.dataset.no, 'rejected'));
}

/* ================= THE LIVE CLASS =================
   The video itself is Daily's ready-made room (camera, microphone, everyone's
   tiles, chat; the teacher can also share her screen from a laptop). On top of
   it this page adds its own classroom tools. They travel as small messages
   inside the video room, so they cost nothing extra:
     task with a countdown · star · quiz race · drawing board · kids' drawing pads
     raise hand · ask to speak · mute all · voice answers · end class + star card
   The waiting room and voice answers also use the database (or_call). */
let FRAME = null, TASK_T = null, IS_HOST = false, LIVE = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 9);

function loadDaily() {
  if (window.DailyIframe) return Promise.resolve();
  return new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = 'https://unpkg.com/@daily-co/daily-js';
    s.onload = () => ok(); s.onerror = () => bad(new Error('Could not load the video'));
    document.head.appendChild(s);
  });
}

/* ---------- who is in the room ---------- */
function roster() { try { return FRAME ? (FRAME.participants() || {}) : {}; } catch (e) { return {}; } }
function others() { const ps = roster(); return Object.keys(ps).filter(k => k !== 'local').map(k => Object.assign({ sid: ps[k].session_id || k }, ps[k])); }
function teacherSid() { const t = others().find(p => p.owner); return t ? t.sid : '*'; }
function sidOf(name) { const p = others().find(x => x.user_name === name); return p ? p.sid : null; }
function nameOf(sid) { const p = others().find(x => x.sid === sid); return p ? p.user_name : ''; }
function kidNames() { return others().filter(p => !p.owner).map(p => p.user_name).filter(Boolean); }

/* ---------- messages ---------- */
function post(msg, to) { try { if (FRAME) FRAME.sendAppMessage(msg, to || '*'); } catch (e) {} }
function send(msg) { onMsg(msg, 'local'); post(msg); }            // to everyone, me included
/* long things (a whole drawing) go in small parts, a little apart */
function packStrokes(strokes) {
  const pieces = [];
  strokes.forEach(s => {
    const p = s.p || [];
    if (p.length <= 400) pieces.push(s);
    else for (let i = 0; i < p.length - 2; i += 398) pieces.push({ id: s.id + '_' + i, c: s.c, w: s.w, p: p.slice(i, i + 400) });
  });
  const parts = []; let cur = [], size = 0;
  pieces.forEach(s => { const n = JSON.stringify(s).length; if (size + n > 2800 && cur.length) { parts.push(cur); cur = []; size = 0; } cur.push(s); size += n; });
  if (cur.length || !parts.length) parts.push(cur);
  return parts;
}
async function sendChunks(kind, strokes, to, extra) {
  const parts = packStrokes(strokes), k = rid();
  for (let i = 0; i < parts.length; i++) {
    post(Object.assign({ kind: kind, k: k, i: i, n: parts.length, s: parts[i] }, extra || {}), to);
    if (parts.length > 1) await sleep(70);
  }
}
const CHUNKS = {};
function gotChunk(m, done) {
  const c = CHUNKS[m.k] = CHUNKS[m.k] || { n: m.n, parts: {}, at: Date.now() };
  c.parts[m.i] = m.s || [];
  if (Object.keys(c.parts).length >= c.n) {
    delete CHUNKS[m.k];
    let all = []; for (let i = 0; i < c.n; i++) all = all.concat(c.parts[i] || []);
    done(all);
  }
}

/* ---------- opening and closing the room ---------- */
function liveReset(c, host) {
  return { cls: c, host: host, name: host ? (INFO.teacher || 'Teacher') : '', tag: rid().slice(0, 4), joined: false,
    hand: false, hands: [], waiting: [], openDoor: false, voicesNew: 0, scores: {}, quiz: null, kq: null, task: null,
    pads: {}, padsNew: 0, rec: null, ended: false, pollT: null, boardHidden: false };
}
async function joinLive(c, host) {
  if (LIVE) return;
  IS_HOST = host; LIVE = liveReset(c, host);
  BOARD = { on: false, all: false, title: '', strokes: [] }; MYPAD = { strokes: [] }; VIEW = null; GAME = null; GSHOW = { pos: {}, busy: false, hidden: false };
  $('live').classList.remove('hide'); $('liveTitle').textContent = c.title;
  $('liveCtl').innerHTML = '<button id="lLeave" style="background:#E5484D">Leave</button>';
  $('lLeave').onclick = () => leaveLive();
  if (!host && !(await waitAtDoor(c))) return;
  toast('Opening the class…');
  let pass;
  try { pass = await roomPass(c.id); await loadDaily(); }
  catch (e) { leaveLive(true); return toast(e.message, true); }
  if (!LIVE || LIVE.cls !== c) return;
  LIVE.name = pass.name || LIVE.name;
  $('liveCtl').innerHTML = host
    ? '<button class="gold" id="lQuiz"><b>❓</b>Quiz</button><button id="lBoard"><b>✏️</b>Board</button><button id="lTask"><b>⏱</b>Task</button><button id="lMore"><b>⋯</b>More</button><button id="lLeave" style="background:#E5484D"><b>■</b>End</button>'
    : '<button id="lHand"><b>✋</b>Hand</button><button id="lDraw"><b>✏️</b>Draw</button><button id="lLeave" style="background:#E5484D"><b>👋</b>Leave</button>';
  FRAME = window.DailyIframe.createFrame($('liveFrame'), { showLeaveButton: false, iframeStyle: { position: 'absolute', inset: '0', width: '100%', height: '100%', border: '0' } });
  FRAME.on('app-message', ev => onMsg(ev && ev.data, ev && ev.fromId));
  FRAME.on('left-meeting', () => leaveLive());
  FRAME.on('error', ev => toast('Video: ' + videoErr(ev), true));
  FRAME.on('camera-error', ev => toast('Camera/mic: ' + videoErr(ev) + ' — allow camera and microphone for this site in the browser settings', true));
  if (host) FRAME.on('participant-joined', ev => { const sid = ev && ev.participant && ev.participant.session_id; if (sid) setTimeout(() => syncTo(sid), 1500); });
  try { await FRAME.join({ url: pass.url, token: pass.token }); }
  catch (e) { const m = videoErr(e); leaveLive(true); return showVideoErr(m); }
  if (!LIVE) return;
  LIVE.joined = true;
  $('lLeave').onclick = host ? endSheet : () => leaveLive();
  if (host) {
    $('lQuiz').onclick = quizSheet; $('lBoard').onclick = toggleBoard; $('lTask').onclick = taskSheet; $('lMore').onclick = moreSheet;
    pollRoom(); LIVE.pollT = setInterval(pollRoom, 4000);
  } else {
    $('lHand').onclick = toggleHand; $('lDraw').onclick = openMyPad;
    certFor(c);                        // a star card starts the moment the child is in
  }
  renderStrip();
}
/* the waiting room: ask every 3 seconds until the teacher lets this child in */
async function waitAtDoor(c) {
  while (LIVE && LIVE.cls === c) {
    let r;
    try { r = await api({ action: 'roomcheck', class_id: c.id }); }
    catch (e) { leaveLive(true); toast(e.message, true); return false; }
    if (!LIVE || LIVE.cls !== c) return false;
    if (r && r.ok) { $('liveWait').classList.add('hide'); return true; }
    $('liveWait').innerHTML = '<div class="door">🚪</div><div class="ctitle" style="color:#fff">' + esc((r && r.msg) || 'Waiting for the teacher') + '…</div>' +
      '<div class="sm" style="color:#C9CEDD">' + esc(r && r.name ? 'Hello ' + r.name + '! ' : '') + 'The class starts at ' + esc(when(c.starts_at).split(', ').pop()) + '. Keep this screen open.</div>';
    $('liveWait').classList.remove('hide');
    await sleep(3000);
  }
  return false;
}
function leaveLive(quiet) {
  if (!LIVE && !FRAME) { $('live').classList.add('hide'); return; }
  const was = LIVE; LIVE = null;
  if (was && was.pollT) clearInterval(was.pollT);
  if (was && was.rec && was.rec.mr && was.rec.mr.state === 'recording') { try { was.rec.mr.stop(); } catch (e) {} }
  const f = FRAME; FRAME = null;
  if (f) { try { f.destroy(); } catch (e) {} }
  clearInterval(TASK_T);
  ['taskBanner', 'starPop', 'quizCard', 'voiceCard', 'speakPop', 'board', 'game', 'liveWait'].forEach(id => $(id).classList.add('hide'));
  $('liveStrip').innerHTML = '';
  $('live').classList.add('hide');
  closeSheet();
  if (was && !was.host && S.screen === 'home') vHome();      // the new star card shows on the home screen
  if (!quiet && was && !was.host && was.joined) showCert(was.cls.id, was.ended);
}
function endSheet() {
  sheet('<h2>End the class?</h2>' +
    '<button class="btn red block" id="enAll">End the class for everyone</button>' +
    '<button class="btn ghost block" id="enMe">Leave — the class carries on</button>' +
    '<button class="btn ghost block" id="enNo">Stay</button>', () => {
      $('enNo').onclick = closeSheet;
      $('enMe').onclick = () => { closeSheet(); if (FRAME) FRAME.leave(); else leaveLive(); };
      $('enAll').onclick = async () => {
        closeSheet(); post({ kind: 'end' }); await sleep(900);
        try { FRAME && FRAME.updateParticipants({ '*': { eject: true } }); } catch (e) {}
        await sleep(300); if (FRAME) FRAME.leave(); else leaveLive();
      };
    });
}
/* someone came in late: give them what is on screen now */
function syncTo(sid) {
  if (!LIVE || !LIVE.host) return;
  if (LIVE.task && LIVE.task.end > Date.now()) post({ kind: 'task', text: LIVE.task.text, secs: Math.round((LIVE.task.end - Date.now()) / 1000) }, sid);
  post({ kind: 'score', s: LIVE.scores }, sid);
  if (LIVE.quiz && !LIVE.quiz.done) post({ kind: 'quiz', id: LIVE.quiz.id, q: LIVE.quiz.q, o: LIVE.quiz.o }, sid);
  if (BOARD.on) { post({ kind: 'board', on: true, all: BOARD.all, title: BOARD.title }, sid); sendChunks('bload', BOARD.strokes, sid); }
  if (GAME) post({ kind: 'game', g: GAME }, sid);
}

/* ---------- every message that arrives ---------- */
function onMsg(m, from) {
  if (!m || typeof m !== 'object' || !LIVE) return;
  const mine = from === 'local';
  const sender = mine ? LIVE.name : (nameOf(from) || m.from || '');
  switch (m.kind) {
    case 'task': {
      clearInterval(TASK_T);
      let left = Math.max(0, parseInt(m.secs, 10) || 0);
      LIVE.task = { text: String(m.text || '').slice(0, 120), end: Date.now() + left * 1000 };
      $('taskText').textContent = LIVE.task.text;
      const draw = () => { $('taskSecs').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
      draw(); $('taskBanner').classList.remove('hide');
      TASK_T = setInterval(() => { left--; if (left < 0) { clearInterval(TASK_T); $('taskSecs').textContent = 'Time!'; setTimeout(() => $('taskBanner').classList.add('hide'), 4000); return; } draw(); }, 1000);
      break;
    }
    case 'endtask': clearInterval(TASK_T); LIVE.task = null; $('taskBanner').classList.add('hide'); break;
    case 'star': {
      $('starName').textContent = String(m.to || '').slice(0, 40) + ' got a star!';
      const p = $('starPop'); p.classList.remove('hide'); setTimeout(() => p.classList.add('hide'), 3000);
      if (!LIVE.host && m.to === LIVE.name) certAdd('stars', 1);
      break;
    }
    case 'end': if (!LIVE.host) { LIVE.ended = true; if (FRAME) FRAME.leave(); else leaveLive(); } break;
    /* drawing board */
    case 'board': if (!LIVE.host) { BOARD.on = !!m.on; BOARD.all = !!m.all; BOARD.title = String(m.title || '').slice(0, 60);
        if (BOARD.on) { LIVE.boardHidden = false; if (VIEW !== 'mine') VIEW = 'shared'; else toast('The teacher opened the board — tap “Show board” to see it'); }
        else if (VIEW === 'shared') VIEW = null;
        renderBoard(); renderStrip(); } break;
    case 'st': if (!mine) boardStroke(m); break;
    case 'bundo': if (!mine) { BOARD.strokes = BOARD.strokes.filter(s => s.id !== m.id && s.id.indexOf(m.id + '_') !== 0); drawAll(); } break;
    case 'bclear': if (!mine) { BOARD.strokes = []; drawAll(); } break;
    case 'bload': gotChunk(m, all => { BOARD.strokes = all; drawAll(); }); break;
    /* quiz race */
    case 'quiz': if (!LIVE.host) { LIVE.kq = { id: m.id, q: String(m.q || ''), o: (m.o || []).slice(0, 4).map(String), picked: null, res: null }; renderQuizKid(); } break;
    case 'qa': if (LIVE.host) judge(m, sender); break;
    case 'qwin':
      if (LIVE.host) renderQuizHost();
      else if (LIVE.kq && LIVE.kq.id === m.id) { LIVE.kq.res = m; renderQuizKid(); const id = m.id; setTimeout(() => { if (LIVE && LIVE.kq && LIVE.kq.id === id) { LIVE.kq = null; renderQuizKid(); } }, 4500); }
      break;
    case 'qclose': if (!LIVE.host && LIVE.kq && LIVE.kq.id === m.id) { LIVE.kq = null; renderQuizKid(); } break;
    case 'score': LIVE.scores = m.s || {}; if (!LIVE.host) { certSet('points', LIVE.scores[LIVE.name] || 0); renderStrip(); } break;
    /* hands and talking */
    case 'hand': if (LIVE.host && sender) {
        LIVE.hands = LIVE.hands.filter(n => n !== sender); if (m.up) { LIVE.hands.push(sender); toast('✋ ' + sender + ' raised a hand'); }
        renderStrip(); } break;
    case 'handdown': if (!LIVE.host) { LIVE.hand = false; renderHandBtn(); } break;
    case 'speak': if (!LIVE.host) { LIVE.hand = false; renderHandBtn(); showSpeak(); } break;
    /* voice answers and drawings sent to the teacher */
    case 'voice': if (!LIVE.host) openVoiceCard(m); break;
    case 'vnew': if (LIVE.host) { LIVE.voicesNew++; toast('🎙 ' + (sender || 'A child') + ' sent a voice answer'); renderStrip(); } break;
    case 'game': gotGame(m.g || null); break;
    case 'roll': if (LIVE.host && GAME && m.id === GAME.id && m.seq === GAME.seq) hostRoll(sender); break;
    case 'pad': if (LIVE.host) gotChunk(m, all => { const who = m.from || sender || 'A child'; LIVE.pads[who] = { strokes: all, at: Date.now() }; LIVE.padsNew++; toast('🎨 ' + who + ' sent a drawing'); renderStrip(); }); break;
  }
}

/* ---------- the strip of little buttons at the top of the video ---------- */
function renderStrip() {
  if (!LIVE) return;
  const ch = [];
  if (LIVE.host) {
    if (LIVE.waiting.length === 1) ch.push('<button class="schip gold" data-s="let1">🚪 Let ' + esc(LIVE.waiting[0].name) + ' in</button>');
    else if (LIVE.waiting.length > 1) ch.push('<button class="schip gold" data-s="door">🚪 ' + LIVE.waiting.length + ' at the door</button>');
    LIVE.hands.forEach((n, i) => ch.push('<button class="schip" data-hand="' + i + '">✋ ' + esc(n) + '</button>'));
    if (LIVE.voicesNew) ch.push('<button class="schip" data-s="voices">🎙 ' + LIVE.voicesNew + ' new</button>');
    if (LIVE.padsNew) ch.push('<button class="schip" data-s="pads">🎨 ' + LIVE.padsNew + ' new</button>');
  } else {
    const pts = LIVE.scores[LIVE.name] || 0;
    if (pts) ch.push('<span class="schip">🏆 ' + pts + '</span>');
    if (BOARD.on && (LIVE.boardHidden || VIEW === 'mine')) ch.push('<button class="schip gold" data-s="board">✏️ Show board</button>');
    if (GAME && GSHOW.hidden) ch.push('<button class="schip gold" data-s="game">🎲 Show game</button>');
    if (LIVE.rec && LIVE.rec.min) ch.push('<button class="schip gold" data-s="voice">🎙 Record answer</button>');
  }
  $('liveStrip').innerHTML = ch.join('');
  $('liveStrip').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s;
    if (s === 'let1') admit(LIVE.waiting[0].parent_id);
    else if (s === 'door') doorSheet();
    else if (s === 'voices') voiceSheet(LIVE.cls.id, true);
    else if (s === 'pads') padsSheet();
    else if (s === 'voice') { if (LIVE.rec) { LIVE.rec.min = false; renderVoiceCard(); } }
    else if (s === 'game') { GSHOW.hidden = false; renderGame(); renderStrip(); }
    else if (s === 'board') { LIVE.boardHidden = false; VIEW = 'shared'; renderBoard(); renderStrip(); }
  });
  $('liveStrip').querySelectorAll('[data-hand]').forEach(b => b.onclick = () => handSheet(LIVE.hands[+b.dataset.hand]));
}

/* ---------- waiting room (teacher) ---------- */
async function pollRoom() {
  if (!LIVE || !LIVE.host) return;
  try {
    const r = await api({ action: 'room_state', class_id: LIVE.cls.id });
    if (!LIVE) return;
    const before = LIVE.waiting.map(w => w.parent_id).join();
    LIVE.waiting = r.waiting || []; LIVE.openDoor = !!r.open_door;
    if (LIVE.waiting.length && LIVE.waiting.map(w => w.parent_id).join() !== before) toast('🚪 ' + LIVE.waiting.map(w => w.name).join(', ') + ' at the door');
    if ((r.unheard || 0) > LIVE.voicesNew) LIVE.voicesNew = r.unheard;
    renderStrip();
  } catch (e) {}
}
async function admit(parentId, all) {
  try { await api({ action: 'admit', class_id: LIVE.cls.id, parent_id: parentId || null, all: !!all }); toast('Letting in…'); } catch (e) { toast(e.message, true); }
  closeSheet(); pollRoom();
}
function doorSheet() {
  sheet('<h2>Waiting room</h2>' +
    (LIVE.waiting.length ? LIVE.waiting.map((w, i) => '<div class="card row"><div class="grow" style="font-weight:800">🚪 ' + esc(w.name) + '</div><button class="btn teal small" data-in="' + i + '">Let in</button></div>').join('') +
      '<button class="btn teal block" id="dAll">Let everyone in</button>' : '<div class="empty">Nobody is waiting.</div>') +
    '<label class="card row" style="cursor:pointer"><input type="checkbox" id="dOpen"' + (LIVE.openDoor ? ' checked' : '') + ' style="width:22px;height:22px"><span class="grow">Let children in without asking, for the rest of this class</span></label>' +
    '<button class="btn ghost block" id="dNo">Close</button>', () => {
      $('dNo').onclick = closeSheet;
      document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => admit(LIVE.waiting[+b.dataset.in].parent_id));
      if ($('dAll')) $('dAll').onclick = () => admit(null, true);
      $('dOpen').onchange = async () => { try { await api({ action: 'open_door', class_id: LIVE.cls.id, on: $('dOpen').checked }); LIVE.openDoor = $('dOpen').checked; toast(LIVE.openDoor ? 'Door open: children come straight in' : 'Waiting room on'); pollRoom(); } catch (e) { toast(e.message, true); } };
    });
}

/* ---------- raise hand, ask to speak, mute ---------- */
function renderHandBtn() { const b = $('lHand'); if (!b || !LIVE) return; b.classList.toggle('gold', LIVE.hand); b.innerHTML = '<b>✋</b>' + (LIVE.hand ? 'Hand up' : 'Hand'); }
function toggleHand() { LIVE.hand = !LIVE.hand; post({ kind: 'hand', up: LIVE.hand, from: LIVE.name }, teacherSid()); renderHandBtn(); if (LIVE.hand) toast('Hand up — the teacher can see it'); }
function handSheet(name) {

function showSpeak() {

/* ---------- teacher's “More” ---------- */
function moreSheet() {

  sheet('<h2>More</h2><div class="mgrid">' +
    '<button class="mbtn" id="mStar">⭐<span>Give a star</span></button>' +

    '<button class="mbtn" id="mGame">🎲<span>Snakes &amp; Ladders</span></button>' +
    '<button class="mbtn" id="mScr">🖥<span>Share screen</span></button>' +

      $('mNo').onclick = closeSheet;

/* ================= QUIZ RACE =================
   The teacher asks; each child gets ONE try; the first right answer to reach
   the teacher's phone wins the point and the question vanishes for everyone. */
const QCOL = ['#E5484D', '#1F6FEB', '#C98A00', '#2DA44E'], QSHAPE = ['▲', '●', '■', '◆'];
let QGEN = { op: '+', lvl: 1 };
function mathQ(g) {
  const ops = g.op === 'mix' ? ['+', '−', '×'] : [g.op];
  const op = ops[Math.floor(Math.random() * ops.length)];
  const R = n => Math.floor(Math.random() * (n + 1));
  const top = [10, 20, 50][g.lvl] || 10, mtop = [5, 10, 12][g.lvl] || 5;
  let a, b, ans;
  if (op === '+') { a = R(top - 1) + 1; b = R(top - a); ans = a + b; }
  else if (op === '−') { a = R(top - 1) + 1; b = R(a); ans = a - b; }
  else { a = R(mtop - 1) + 1; b = R(mtop - 1) + 1; ans = a * b; }
  const set = new Set([ans]);

  for (const d of near.sort(() => Math.random() - .5)) { if (set.size >= 4) break; const v = ans + d; if (v >= 0 && v !== ans) set.add(v); }
  for (let v = ans + 4; set.size < 4; v++) set.add(v);
  const o = Array.from(set).sort(() => Math.random() - .5);
  return { q: a + ' ' + op + ' ' + b + ' = ?', o: o.map(String), a: o.indexOf(ans) };
}

  const i = parseInt(m.i, 10), right = i === z.a;
  z.answered.push({ who: who, i: i, right: right });
  if (right) {

    send({ kind: 'qwin', id: z.id, name: who, a: z.a, ans: z.o[z.a] });
    send({ kind: 'score', s: LIVE.scores });

  }
}

/* ================= DRAWING BOARD =================
   One shared board (the teacher's — children can draw on it too when she

   A drawing is a list of strokes; points are on a 1000 × 700 sheet. */
const BW = 1000, BH = 700;

  if (BOARD.on && VIEW === 'shared') return closeBoard();
  BOARD.on = true; VIEW = 'shared';

  if (BOARD.strokes.length) sendChunks('bload', BOARD.strokes, '*');
  renderBoard();
}
function closeBoard() { BOARD.on = false; VIEW = null; post({ kind: 'board', on: false }); renderBoard(); }

function renderBoard() {
  const el = $('board');
  if (!LIVE || !VIEW || (VIEW === 'shared' && (!BOARD.on || (!IS_HOST && LIVE.boardHidden)))) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const edit = canEdit();
  const sw = COLORS.slice(0, 6).map((c, i) => '<button class="sw' + (TOOL.c === i && TOOL.w < 3 ? ' on' : '') + '" data-c="' + i + '" style="background:' + c + '" aria-label="Colour ' + (i + 1) + '"></button>').join('');
  const sizes = [0, 1, 2].map(i => '<button class="tb' + (TOOL.w === i ? ' on' : '') + '" data-w="' + i + '" aria-label="Line size ' + (i + 1) + '"><span style="display:inline-block;border-radius:50%;background:currentColor;width:' + (6 + i * 6) + 'px;height:' + (6 + i * 6) + 'px"></span></button>').join('');
  const tools = edit ? sw + sizes + '<button class="tb' + (TOOL.w === 3 ? ' on' : '') + '" id="bEr">Eraser</button><button class="tb" id="bUndo">↶ Undo</button>' : '';
  let right = '';
  if (VIEW === 'mine') right = '<button class="tb" id="bClr">Clear</button><button class="tb gold" id="bSend">Send to teacher</button><button class="tb" id="bClose">✕</button>';
  else if (IS_HOST) right = '<button class="tb" id="bClr">Clear</button><button class="tb' + (BOARD.all ? ' gold' : '') + '" id="bAll">' + (BOARD.all ? 'Kids drawing: ON' : 'Let kids draw') + '</button><button class="tb" id="bClose">Close board</button>';
  else right = (BOARD.all ? '' : '<span class="sm" style="color:#C9CEDD;padding:0 6px">' + esc(BOARD.title || 'Teacher’s board') + '</span>') + '<button class="tb" id="bHide">See video</button>';
  $('bTools').innerHTML = tools + '<span class="grow"></span>' + right;
  $('bTitle').textContent = VIEW === 'mine' ? 'My drawing pad' : (BOARD.title || (IS_HOST ? 'Board — everyone sees this' : ''));
  $('bTools').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { TOOL.c = +b.dataset.c; if (TOOL.w === 3) TOOL.w = 1; renderBoard(); });
  $('bTools').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { TOOL.w = +b.dataset.w; renderBoard(); });

    if (!MYPAD.strokes.length) return toast('Draw something first', true);

  };
  if ($('bClose')) $('bClose').onclick = () => { if (VIEW === 'mine') openMyPad(); else closeBoard(); };
  if ($('bAll')) $('bAll').onclick = () => { BOARD.all = !BOARD.all; post({ kind: 'board', on: true, all: BOARD.all, title: BOARD.title }); renderBoard(); };

}
function fitBoard() {

function flush() {

function boardPoint(e) { const r = $('bCanvas').getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * BW), Math.round((e.clientY - r.top) / r.height * BH)]; }

  if (c.stars) { x.fillStyle = '#1B2340'; x.font = '800 92px ' + FD; x.fillText(String(c.stars), W / 2, 362); }
  x.fillStyle = '#5B647D'; x.font = '700 50px ' + FB; x.fillText('Well done,', W / 2, 560);
  x.fillStyle = '#1B2340'; x.font = fitText(x, c.name || 'Star', W - 200, 120, '800', FD); x.fillText(c.name || 'Star', W / 2, 690);
  x.fillStyle = '#5B647D'; x.font = '700 42px ' + FB; x.fillText('for joining the class', W / 2, 780);
  x.fillStyle = '#0F6E70'; const title = String(c.title || ''); x.font = fitText(x, title, W - 200, 64, '800', FD); x.fillText(title, W / 2, 870);
  const line = [];
  if (c.stars) line.push('★ ' + c.stars + (c.stars === 1 ? ' star' : ' stars'));
  if (c.points) line.push('🏆 ' + c.points + (c.points === 1 ? ' quiz point' : ' quiz points'));
  if (line.length) { x.fillStyle = '#B07A00'; x.font = '800 54px ' + FB; x.fillText(line.join('   '), W / 2, 1000); }
  x.fillStyle = '#5B647D'; x.font = '700 36px ' + FB;
  x.fillText(new Date(c.at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) + (c.teacher ? '  ·  Teacher: ' + c.teacher : ''), W / 2, 1150);
  x.fillStyle = '#0F6E70'; x.font = '800 34px ' + FB; x.fillText(location.host, W / 2, 1220);
  return cv;
}
async function showCert(classId, finished) {
  const c = certs()[classId]; if (!c) return;
  const cv = await drawCert(c);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob), file = 'open-room-' + String(c.name || 'star').replace(/\W+/g, '-').toLowerCase() + '.png';
  const msg = (c.name || 'My child') + (c.stars ? ' earned ' + c.stars + ' star' + (c.stars === 1 ? '' : 's') + ' in' : ' joined') + ' “' + c.title + '” at Open Room — small live classes for kids. ' + location.origin + location.pathname;
  sheet('<h2>' + (finished ? 'Class finished! 🎉' : '⭐ Star card') + '</h2><img src="' + url + '" alt="Star card for ' + esc(c.name) + '" style="width:100%;border-radius:14px">' +
    '<button class="btn teal block" id="ceShare">Share on WhatsApp</button><a class="btn ghost block" id="ceSave" href="' + url + '" download="' + file + '">Save picture</a>' +
    '<button class="btn ghost block" id="ceNo">Close</button>', () => {
      $('ceNo').onclick = closeSheet;
      $('ceShare').onclick = async () => {
        try {
          const f = new File([blob], file, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: msg }); return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        location.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
      };
    });
}

/* Daily sends errors as objects, not plain text — turn them into words a person can act on */
function videoErr(e) {
  if (!e) return 'unknown problem';
  if (typeof e === 'string') return e;
  const type = (e.error && (e.error.type || (e.error.details && e.error.details.type))) || e.type || '';
  const msg = e.errorMsg || (e.error && (e.error.msg || e.error.message)) || e.message || '';
  const plain = {
    'account-missing-payment-method': 'the Daily account needs a card added (Daily dashboard → Billing). It stays free inside the free minutes.',
    'exp-room': 'this class room has expired. Check the class date/time.',
    'exp-token': 'the class pass has expired. Close and tap Join again.',
    'nbf-room': 'the class room is not open yet.',
    'nbf-token': 'the class pass is not valid yet. Check the phone\'s clock.',
    'meeting-full': 'the class is full.',
    'no-room': 'the class room was not found.',
    'not-allowed': 'this pass is not allowed into the room.',
    'connection-error': 'the internet connection dropped. Try again.',
    'ejected': 'you were removed from the class.'
  };
  if (plain[type]) return plain[type] + ' [' + type + ']';
  const t = [type, msg].filter(Boolean).join(': ');
  if (t) return t;
  try { return JSON.stringify(e).slice(0, 300); } catch (x) { return String(e); }
}
function showVideoErr(m) {
  sheet('<h2>Could not join the video</h2><div style="word-break:break-word;margin:8px 0">' + esc(m) + '</div><div class="sm">Send a screenshot of this to whoever set up the app.</div><button class="btn" id="veOk" style="margin-top:12px">OK</button>',
    () => { $('veOk').onclick = closeSheet; });
}

/* ---------------- start ---------------- */
(async function start() {
  if (SUPA_URL.indexOf('http') !== 0) {
    $('app').innerHTML = '<main><div class="card"><div class="ctitle">Almost ready</div><div>Put your Supabase address and key at the top of this file (SUPA_URL and SUPA_KEY).</div></div></main>';
    return;
  }
  wireCanvas();
  await loadPublic();
  if (location.hash === '#teacher' || ME.role === 'teacher') {
    if (ME.role === 'teacher') { await loadTeacher(); go('tclasses'); } else go('tlogin');
  } else { await loadMine(); go('home'); }
  /* keep the page fresh: new bookings, confirmations, the Join button opening */
  const fresh = async () => {
    if (!$('live').classList.contains('hide') || $('overlay').innerHTML) return;
    if (S.screen === 'home') { await loadPublic(); await loadMine(); if (S.screen === 'home' && !$('overlay').innerHTML) vHome(); }
    else if (S.screen === 'tclasses' || S.screen === 'tpay') { await loadTeacher(); if (!$('overlay').innerHTML) render(); }
  };
  setInterval(fresh, 15000);
  /* coming back to the app (switching from WhatsApp etc.) refreshes at once */
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fresh(); });
  window.addEventListener('focus', fresh);
})();
</script>
