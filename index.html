  $('mtFile').onchange = async () => {
    const files = [...$('mtFile').files]; if (!files.length) return;
    let n = 0;
    for (const f of files) {
      $('mtProg').textContent = 'Saving ' + (n + 1) + ' of ' + files.length + '…';
      try { await addSheet(f); n++; } catch (e) { toast(e.message, true); }
    }
    toast(n === 1 ? 'Worksheet saved' : n + ' worksheets saved'); vTMat();
  };
  document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => viewSheet(sheets[+b.dataset.sv]));
  document.querySelectorAll('[data-sr]').forEach(b => b.onclick = async () => {
    const x = sheets[+b.dataset.sr], t = prompt('Name for this worksheet', x.title); if (!t || !t.trim()) return;
    try { await api({ action: 'sheet_rename', id: x.id, title: t }); vTMat(); } catch (e) { toast(e.message, true); }
  });
  document.querySelectorAll('[data-sx]').forEach(b => b.onclick = async () => {
    const x = sheets[+b.dataset.sx]; if (!confirm('Delete “' + x.title + '”? Classes that use it will not show it any more.')) return;
    try { await api({ action: 'sheet_del', id: x.id }); delete SHEETS[x.id]; vTMat(); } catch (e) { toast(e.message, true); }
  });
}
async function addSheet(f) {
  let d; try { d = await shrinkPic(f, 1400, 0.78); if (d.length > 850000) d = await shrinkPic(f, 1000, 0.65); }
  catch (e) { throw new Error('Could not open “' + f.name + '”'); }
  const title = (f.name || 'Worksheet').replace(/\.[a-z0-9]+$/i, '').replace(/[_-]+/g, ' ').slice(0, 60) || 'Worksheet';
  const r = await api({ action: 'sheet_add', title: /^(img|image|photo|screenshot|pxl|dsc)\b/i.test(title) ? 'Worksheet ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : title, data: d });
  SHEETS[r.id] = d; return r.id;
}
async function viewSheet(x, canSave) {
  let d = ''; try { d = await sheetData(x.id); } catch (e) { return toast(e.message, true); }
  sheet('<h2>' + esc(x.title) + '</h2><img src="' + d + '" alt="' + esc(x.title) + '" class="shbig">' +
    '<a class="btn teal block" download="' + esc(x.title.replace(/[^\w ]+/g, '').trim() || 'worksheet') + '.jpg" href="' + d + '">Save to this phone</a>' +
    '<button class="btn ghost block" id="vsNo">Close</button>', () => { $('vsNo').onclick = closeSheet; });
}
/* pick what a class uses */
async function kitSheet(c) {
  if (!c) return;
  let songs = [], acts = [], sheets = [];
  try {
    [songs, acts, sheets] = await Promise.all([api({ action: 'music_list' }).then(r => r.songs || []), api({ action: 'act_list' }).then(r => r.acts || []), api({ action: 'sheet_list' }).then(r => r.sheets || [])]);
  } catch (e) { return toast(e.message, true); }
  const k = c.kit || {}, has = (list, id) => (k[list] || []).indexOf(id) >= 0;
  const allActs = acts.map(a => ({ id: a.id, title: a.title })).concat(MATCH_SETS.map(a => ({ id: a.id, title: a.title + ' (ready-made)' })));
  const box = (list, x) => '<label class="kitrow"><input type="checkbox" data-k="' + list + '" value="' + esc(x.id) + '"' + (has(list, x.id) ? ' checked' : '') + '>' +
    (list === 'sheets' ? '<img data-thumb="' + x.id + '" alt="">' : '') + '<span>' + esc(x.title) + '</span></label>';
  sheet('<h2>📚 Material for “' + esc(c.title) + '”</h2><div class="sm">Tick what this class uses. In class it is at the top of <b>More</b>, ready to tap.</div>' +
    '<div class="f">📄 Worksheets &amp; pictures</div>' + (sheets.length ? sheets.map(x => box('sheets', x)).join('') : '<div class="sm">None yet — add them in 📚 Study material.</div>') +
    '<label class="kitrow share"><input type="checkbox" id="kShare"' + (k.share ? ' checked' : '') + '><span><b>Send the worksheets to booked families</b><br><span class="sm">They see them on the class page now, to print or keep ready.</span></span></label>' +
    '<div class="f">🎵 Songs</div>' + (songs.length ? songs.map(x => box('songs', x)).join('') : '<div class="sm">None yet.</div>') +
    '<div class="f">🧩 Match-it</div>' + allActs.map(x => box('acts', x)).join('') +
    '<button class="btn block" id="kGo">Save</button><button class="btn ghost block" id="kMore">＋ Add new material</button><button class="btn ghost block" id="kNo">Close</button>', () => {
      fillThumbs();
      $('kNo').onclick = closeSheet; $('kMore').onclick = () => { closeSheet(); go('tmat'); };
      $('kGo').onclick = async () => {
        const pick = list => [...document.querySelectorAll('[data-k="' + list + '"]:checked')].map(i => i.value);
        const kit = { songs: pick('songs'), acts: pick('acts'), sheets: pick('sheets'), share: $('kShare').checked };
        $('kGo').disabled = true;
        try { await api({ action: 'class_kit_save', class_id: c.id, kit: kit }); closeSheet(); await loadTeacher(); render(); toast('Material saved for this class'); }
        catch (e) { $('kGo').disabled = false; toast(e.message, true); }
      };
    });
}
/* in class: the class's own material, one tap away */
async function loadKit(c) {
  LIVE.kit = null;
  if (!kitCount(c.kit)) return;
  try {
    const r = await api({ action: 'class_kit', class_id: c.id });
    let mine = []; if ((r.acts || []).some(id => !MATCH_SETS.find(m => m.id === id))) { try { mine = (await api({ action: 'act_list' })).acts || []; } catch (e) {} }
    const acts = (r.acts || []).map(id => MATCH_SETS.find(m => m.id === id) || mine.find(m => m.id === id)).filter(Boolean).map(a => ({ id: a.id, title: a.title }));
    if (LIVE) LIVE.kit = { songs: r.songs || [], acts: acts, sheets: r.sheets || [] };
  } catch (e) {}
}
function kitRow() {
  const k = LIVE && LIVE.kit; if (!k || !(k.songs.length + k.acts.length + k.sheets.length)) return '';
  return '<div class="f">📚 Ready for this class</div><div class="kitchips">' +
    k.sheets.map((x, i) => '<button class="chip" data-ks="' + i + '">📄 ' + esc(x.title) + '</button>').join('') +
    k.songs.map((x, i) => '<button class="chip" data-kg="' + i + '">🎵 ' + esc(x.title) + '</button>').join('') +
    k.acts.map((x, i) => '<button class="chip" data-ka="' + i + '">🧩 ' + esc(x.title) + '</button>').join('') + '</div>';
}
function wireKitRow() {
  const k = LIVE && LIVE.kit; if (!k) return;
  document.querySelectorAll('[data-ks]').forEach(b => b.onclick = () => { closeSheet(); putSheet(k.sheets[+b.dataset.ks]); });
  document.querySelectorAll('[data-kg]').forEach(b => b.onclick = () => { closeSheet(); musicLoad(k.songs[+b.dataset.kg]); });
  document.querySelectorAll('[data-ka]').forEach(b => b.onclick = () => { closeSheet(); matchStart(k.acts[+b.dataset.ka].id); });
}
/* a saved worksheet on the board for everyone (children can draw on it when “Let kids draw” is on) */
async function putSheet(x) {
  let d; try { d = await sheetData(x.id); } catch (e) { return toast(e.message, true); }
  if (!BOARD.on) toggleBoard();
  setBoardBg(x.id, d); post({ kind: 'bimg', id: x.id });
  toast('“' + x.title + '” is on the board');
}
async function sheetsSheet(inClass) {
  let list = []; try { list = (await api({ action: 'sheet_list' })).sheets || []; } catch (e) { return toast(e.message, true); }
  sheet('<h2>📄 Worksheets</h2><div class="sm">Tap one to put it on the board for everyone. Turn on “Let kids draw” so children can write on it.</div>' +
    (list.length ? '<div class="shgrid">' + list.map((x, i) => '<div class="shcell"><button class="shpic" data-sp="' + i + '"><img data-thumb="' + x.id + '" alt=""></button><div class="shname">' + esc(x.title) + '</div></div>').join('') + '</div>'
      : '<div class="empty">No worksheets saved yet.</div>') +
    '<label class="btn ghost block" for="wsFile" style="cursor:pointer">+ Take a photo / add from this phone</label><input type="file" id="wsFile" accept="image/*" class="hide">' +
    '<button class="btn ghost block" id="wsNo">Close</button>', () => {
      fillThumbs();
      $('wsNo').onclick = closeSheet;
      document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { closeSheet(); putSheet(list[+b.dataset.sp]); });
      $('wsFile').onchange = async () => {
        const f = $('wsFile').files[0]; if (!f) return;
        try { const id = await addSheet(f); closeSheet(); putSheet({ id: id, title: 'Worksheet' }); } catch (e) { toast(e.message, true); }
      };
    });
}
/* families: worksheets the teacher sent for a booked class */
async function classSheets(c) {
  const box = $('cSheets'); if (!box) return;
  let list = []; try { list = (await api({ action: 'class_sheets', class_id: c.id })).sheets || []; } catch (e) { return; }
  if (!list.length || !$('cSheets')) return;
  box.innerHTML = '<div class="card"><div style="font-weight:800">📎 From ' + esc(firstName()) + ' for this class</div><div class="sm">Tap to open. Print it or keep it ready on a second screen.</div>' +
    '<div class="shgrid">' + list.map((x, i) => '<div class="shcell"><button class="shpic" data-cs="' + i + '"><img data-thumb="' + x.id + '" alt=""></button><div class="shname">' + esc(x.title) + '</div></div>').join('') + '</div></div>';
  fillThumbs();
  document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => viewSheet(list[+b.dataset.cs]));
}

/* ================= PRACTICE ROOM: try every class tool without a class ================= */
async function practiceSheet() {
  let r; try { r = await api({ action: 'practice' }); } catch (e) { return toast(e.message, true); }
  const link = location.origin + location.pathname + '?try=' + r.code;
  sheet('<h2>🧪 Practice room</h2><div>Try everything — quiz, board, worksheets, music, Match-it, games — any time, without making a class. Families never see this room.</div>' +
    '<button class="btn teal block" id="prGo">Open the practice room</button>' +
    '<div class="card"><div style="font-weight:800">See it as a child too</div><div class="sm">Open this link on a second phone (or ask a friend). It joins as “Test child” — no sign-up, no waiting room. Works for this practice session only.</div>' +
      '<a class="btn ghost block" href="https://wa.me/?text=' + encodeURIComponent('kidspri practice room — open to join as a test child: ' + link) + '" target="_blank" rel="noopener">Send the link on WhatsApp</a>' +
      '<button class="btn ghost block" id="prCopy">Copy the link</button></div>' +
    '<button class="btn ghost block" id="prNo">Close</button>', () => {
      $('prNo').onclick = closeSheet; $('prCopy').onclick = () => copyText(link, 'Link copied');
      $('prGo').onclick = () => { closeSheet(); joinLive(r.class, true); };
    });
}
let TRY = null;
async function tryJoin(code) {
  try {
    const r = await api({ action: 'practice_join', code: code });
    TRY = { cls: r.class, back: { tok: ME.tok, role: ME.role } };
    ME = { tok: r.tok, role: 'tester' };            // only for this visit — not kept on the phone
    go('try');
  } catch (e) { toast(e.message, true); }
}
function vTry() {
  if (!TRY) return go('home');
  $('app').innerHTML = header(false) + '<main><div class="card"><div class="ctitle">🧪 Practice room</div>' +
    '<div>You are the <b>Test child</b>. You see exactly what children see in class.</div>' +
    '<button class="btn teal block" id="tyGo">Join the practice room</button>' +
    '<button class="btn ghost block" id="tyEnd">Finish testing</button></div></main>';
  $('tyGo').onclick = () => joinLive(TRY.cls, false);
  $('tyEnd').onclick = () => { ME = TRY.back; TRY = null; history.replaceState({ screen: 'home' }, '', location.pathname); go('home'); };
}

/* ---------------- start ---------------- */
(async function start() {
  if (SUPA_URL.indexOf('http') !== 0) {
    $('app').innerHTML = '<main><div class="card"><div class="ctitle">Almost ready</div><div>Put your Supabase address and key at the top of this file (SUPA_URL and SUPA_KEY).</div></div></main>';
    return;
  }
  wireCanvas();
  await loadPublic();
  NAV_POP = true;            // the first screen is the bottom of the history, not a new step
  const qs = new URLSearchParams(location.search), linkCls = qs.get('class'), linkKey = qs.get('k'), tryCode = qs.get('try');
  if (linkKey) { try { history.replaceState(history.state, '', location.pathname + (linkCls ? '?class=' + encodeURIComponent(linkCls) : '')); } catch (e) {} }
  if (location.hash === '#teacher' || (ME.role === 'teacher' && !linkCls)) {
    if (ME.role === 'teacher') { await loadTeacher(); go('tclasses'); } else go('tlogin');
  } else { await loadMine(); go('home'); }
  NAV_POP = false;
  try { history.replaceState({ screen: S.screen }, ''); } catch (e) {}
  if (linkCls && S.screen === 'home') go('cls', { cid: linkCls });   // a shared class link: its page, with the front page behind it
  if (linkKey) linkSignIn(linkKey);
  if (tryCode) tryJoin(tryCode);
  /* keep the page fresh: new bookings, confirmations, the Join button opening */
  const fresh = async () => {
    if (!$('live').classList.contains('hide') || $('overlay').innerHTML) return;
    if (S.screen === 'home') { await loadPublic(); await loadMine(); if (S.screen === 'home' && !$('overlay').innerHTML) ($('landing') ? fillHome() : vHome()); }
    else if (S.screen === 'cls') { await loadPublic(); await loadMine(); if (S.screen === 'cls' && !$('overlay').innerHTML) vClass(); }
    else if (S.screen === 'tclasses' || S.screen === 'tpay' || S.screen === 'tmsgs') { await loadTeacher(); if (!$('overlay').innerHTML) render(); }
  };
  setInterval(fresh, 15000);
  /* coming back to the app (switching from WhatsApp etc.) refreshes at once */
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fresh(); });
  window.addEventListener('focus', fresh);
})();
</script>
